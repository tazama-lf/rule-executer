# Rebuilds the frmscoe rule rc images after a rule-executer change by running
# each rule's package-rule-rc.yml on its dev branch (workflow_dispatch, ref: dev).
#
# The rule repos come from the tazama-lf organization variable FRMSCOE_RULES
# (comma-separated repo names, for example "rule-001,rule-002").
# Kept separate from trigger-rules-901-and-902.yml so it can be disabled while a
# rule-executer change is tested on the public rules first.
#
# GitHub only accepts the dispatch if the rule repo's default branch has a
# package-rule-rc.yml with a workflow_dispatch trigger.

name: Trigger frmscoe rule rc workflows after rule executer repo is updated

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Run package-rule-rc.yml on dev in each rule repo
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN_FRMSCOE }}  # needs Actions: write on each rule repo
          RULE_ORG: frmscoe
          RULE_REPOS: ${{ vars.FRMSCOE_RULES }}
        shell: bash
        run: |
          set -uo pipefail

          if [ -z "$(tr -d '[:space:],' <<< "${RULE_REPOS:-}")" ]; then
            echo "::error::The FRMSCOE_RULES organization variable is empty or not set."
            exit 1
          fi

          failed=()
          IFS=',' read -ra repos <<< "$RULE_REPOS"

          echo "### rc builds dispatched to ${RULE_ORG}" >> "$GITHUB_STEP_SUMMARY"
          for raw in "${repos[@]}"; do
            repo="$(tr -d '[:space:]' <<< "$raw")"
            [ -z "$repo" ] && continue
            if [[ ! "$repo" =~ ^rule-[0-9]{3}$ ]]; then
              echo "::error::Skipping an FRMSCOE_RULES entry that is not a rule-NNN repo name."
              failed+=("\`${repo}\` (not a rule-NNN repo name)")
              continue
            fi
            if gh workflow run package-rule-rc.yml -R "${RULE_ORG}/${repo}" --ref dev; then
              echo "- ${RULE_ORG}/${repo}: dispatched" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Dispatch to ${RULE_ORG}/${repo} failed."
              failed+=("${RULE_ORG}/${repo}")
            fi
          done

          if [ "${#failed[@]}" -gt 0 ]; then
            {
              echo ""
              echo "### Failed"
              printf -- '- %s\n' "${failed[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
